name: Build Ovelin Mall 1.0.6 with native push ACK timeout fix
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Stage and validate Firebase Android configuration
        env:
          FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_ANDROID_CONFIG_JSON"
          printf '%s' "$FIREBASE_ANDROID_CONFIG_JSON" > android/app/google-services.json
          jq -e --arg pkg 'com.ovelinmall.app' --arg project '786618250840' '(.project_info.project_number | tostring) == $project and any(.client[]?; .client_info.android_client_info.package_name == $pkg)' android/app/google-services.json >/dev/null
      - name: Test and build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon --max-workers=2 testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OvelinMall-1.0.6-native-ack-fix
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/test-results/testDebugUnitTest/
          retention-days: 14
